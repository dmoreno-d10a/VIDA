[project]
name = "vida-backend"
version = "0.1.0"
description = "Backend de V.I.D.A. — Vortexbird Intelligent Documentation Assistant"
requires-python = ">=3.12"

# Toda la lógica y las credenciales viven en esta capa (Art. IV de la constitución).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    # Lectura de los formatos que carga el Administrador (spec 002). El
    # reconocimiento de la estructura es determinista y no usa ningun modelo:
    # ver la decision 1 de specs/002-tipos-de-documentacion/research.md.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # LiteLLM se habla por HTTP y no con un SDK de proveedor: es lo que lo
    # hace intercambiable (Art. V, decision 11 de research.md).
    "httpx>=0.28",
    # La carga del formato es multipart/form-data, el unico punto de la
    # plataforma que no es JSON. FastAPI lo necesita para leer el archivo.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
